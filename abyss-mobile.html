function presetSettings(name){
  return Object.hasOwn(postPresets,name)?postPresets[name]:postPresets.high;
}

function setupPostControls(storageKey,onChange,stopFlight){
  const ui=document.getElementById('post-ui');
  const toggle=document.getElementById('post-toggle'),panel=document.getElementById('post-panel');
  const reset=document.getElementById('post-reset'),fields=document.getElementById('post-parameters');
  let saved=null,writeTimer;
  try{saved=JSON.parse(localStorage.getItem(storageKey));}catch{}
  let name=Object.hasOwn(postPresets,saved?.name)?saved.name:'high';
  const custom={};
  for(const [id,defaults] of Object.entries(postPresets)){
    const values=saved?.custom?.[id];
    if(!defaults.level||!values)continue;
    const sample={};
    for(const field of postFields){
      const value=values[field.key];
      if(Number.isFinite(value))sample[field.key]=clamp(value,field.min,field.max);
    }
    custom[id]=sample;
  }
  let settings;
  function persist(){
    clearTimeout(writeTimer);
    try{localStorage.setItem(storageKey,JSON.stringify({name,custom}));}catch{}
  }
  function refresh(){
    settings={...postPresets[name],...custom[name]};
    const isOff=settings.level===0;
    fields.hidden=isOff;
    reset.disabled=isOff;
    for(const {field,input,readout} of sliders){
      if(isOff)continue;
      input.value=settings[field.key];
      readout.value=Number(input.value).toFixed(field.decimals??2);
    }
  }
  function open(value,focus=false){
    panel.hidden=!value;
    toggle.setAttribute('aria-expanded',String(value));
    if(value){
      stopFlight();
      if(focus)ui.querySelector('input[name="post-preset"]:checked').focus();
    }else if(panel.contains(document.activeElement)||focus){
      toggle.focus({preventScroll:true});
    }
  }
  const sliders=postFields.map(field=>{
    const label=document.createElement('label'),caption=document.createElement('span');
    label.className='effect';caption.textContent=field.label;
    const input=document.createElement('input');input.type='range';input.id='post-'+field.key;
    input.setAttribute('aria-label',field.label);
    input.min=field.min;input.max=field.max;input.step=field.step;
    const readout=document.createElement('output');readout.htmlFor=input.id;
    label.append(caption,input,readout);fields.append(label);
    input.addEventListener('input',()=>{
      const value=input.valueAsNumber;
      const levelSettings=custom[name]??(custom[name]={});
      levelSettings[field.key]=value;
      settings[field.key]=value;
      readout.value=value.toFixed(field.decimals??2);
      onChange();
      clearTimeout(writeTimer);
      writeTimer=setTimeout(persist,220);
    });
    input.addEventListener('change',persist);
    return {field,input,readout};
  });
  for(const radio of ui.querySelectorAll('input[name="post-preset"]')){
    radio.checked=radio.value===name;
    radio.addEventListener('change',()=>{
      if(!radio.checked)return;
      name=radio.value;
      refresh();persist();onChange();
    });
  }
  reset.addEventListener('click',()=>{
    delete custom[name];refresh();persist();onChange();
  });
  toggle.addEventListener('click',()=>open(panel.hidden));
  window.addEventListener('keydown',event=>{
    if(event.altKey||event.ctrlKey||event.metaKey||event.repeat)return;
    if(event.code==='KeyO'||(event.code==='Escape'&&!panel.hidden)){
      event.preventDefault();
      open(event.code==='KeyO'&&panel.hidden,true);
    }
  });
  window.addEventListener('pagehide',persist);
  refresh();
  ui.hidden=false;
  return {get settings(){return settings;},get preset(){return name;}};
}

function createPostPipeline(renderer,THREE,triangle,screenCamera,decode,edgeAA){
  const {WebGLRenderTarget,Mesh,Scene,RawShaderMaterial,GLSL3,LinearFilter,NoBlending,NoColorSpace}=THREE;
  const vertexShader='in vec3 position; void main(){gl_Position=vec4(position,1.);}';
  function makePass(id,uniformNames){
    const fragmentShader=document.getElementById(id).textContent.trim().replace(/^#version 300 es[^\S\n]*\n/,'');
    const uniforms=Object.fromEntries(uniformNames.split(' ').map(name=>[name,{value:null}]));
    const material=new RawShaderMaterial({name:id,glslVersion:GLSL3,vertexShader,fragmentShader,uniforms,
      depthTest:false,depthWrite:false,blending:NoBlending,toneMapped:false});
    const mesh=new Mesh(triangle,material);mesh.frustumCulled=false;
    const scene=new Scene();scene.add(mesh);
    return {scene,uniforms};
  }
  function target(){
    return new WebGLRenderTarget(1,1,{depthBuffer:false,colorSpace:NoColorSpace,
      minFilter:LinearFilter,magFilter:LinearFilter});
  }
  const finish=makePass('finish','uImage uBloomImage uRes uOutput uGrade uLens uGlow uDecode uEdgeAA uFrame uLevel');
  const extract=makePass('post-bright','uImage uRes uOutput uThreshold uDecode');
  const blur=makePass('post-blur','uImage uStep uOutput');
  const bright=target(),scratch=target();
  let passes=1;
  function compile(){
    renderer.setRenderTarget(bright);
    const bloom=Promise.all([renderer.compileAsync(extract.scene,screenCamera),renderer.compileAsync(blur.scene,screenCamera)]);
    renderer.setRenderTarget(null);
    return Promise.all([bloom,renderer.compileAsync(finish.scene,screenCamera)]);
  }
  function render(pass,destination,values){
    for(const name in values)pass.uniforms[name].value=values[name];
    renderer.setRenderTarget(destination);
    renderer.render(pass.scene,screenCamera);
  }
  function draw(image,width,height,outW,outH,t,tone,effects){
    let bloomImage=image;
    const sceneSize=[width,height];
    passes=1;
    if(effects.level===3&&(effects.bloom>.001||effects.streak>.001)){
      const w=Math.max(1,Math.ceil(outW/2)),h=Math.max(1,Math.ceil(outH/2)),size=[w,h];
      bright.setSize(w,h);scratch.setSize(w,h);
      render(extract,bright,{uImage:image,uRes:sceneSize,uOutput:size,uThreshold:effects.threshold,uDecode:decode});
      render(blur,scratch,{uImage:bright.texture,uStep:[effects.radius/w,0],uOutput:size});
      render(blur,bright,{uImage:scratch.texture,uStep:[0,effects.radius/h],uOutput:size});
      bloomImage=bright.texture;
      passes=4;
    }
    const e=effects.level?effects:postPresets.high;
    render(finish,null,{
      uImage:image,uBloomImage:bloomImage,uRes:sceneSize,uOutput:[outW,outH],uLevel:effects.level,
      uGrade:[(1.14+.07*tone)*2**e.exposure,e.contrast,e.saturation,e.warmth],
      uLens:[e.vignette,e.grain,e.dispersion,e.sharpness],
      uGlow:[e.bloom,e.radius,e.threshold,e.streak],uDecode:decode,uEdgeAA:edgeAA?1:0,uFrame:Math.floor(t*24)
    });
  }
  return {compile,draw,passes:()=>passes};
}


async function createRenderer(){
  const gl=canvas.getContext('webgl2',{alpha:false,antialias:false,depth:false,
    stencil:false,preserveDrawingBuffer:query.has('capture'),powerPreference:'high-performance'});
  if(!gl)throw new Error('此浏览器未提供 WebGL2。请用启用硬件加速的浏览器打开。');
  const {
    WebGLRenderer,WebGLRenderTarget,BufferGeometry,Float32BufferAttribute,
    Mesh,Scene,Camera,PerspectiveCamera,RawShaderMaterial,GLSL3,
    DepthTexture,HalfFloatType,UnsignedByteType,UnsignedIntType,LinearFilter,LessEqualCompare,
    NoBlending,NoColorSpace,REVISION
  }=AbyssThree;
  const hdr=Boolean(gl.getExtension('EXT_color_buffer_float')||gl.getExtension('EXT_color_buffer_half_float'));
  // Half-float retains hot-metal highlights. Normalized RGBA is the compatibility path.
  const colorScale=hdr?1:.20;
  const renderer=new WebGLRenderer({canvas,context:gl});
  renderer.sortObjects=false;
  renderer.setClearColor(0x080c17);
  const target=new WebGLRenderTarget(1,1,{
    type:hdr?HalfFloatType:UnsignedByteType,internalFormat:hdr?'RGBA16F':'RGBA8',
    colorSpace:NoColorSpace,minFilter:LinearFilter,magFilter:LinearFilter,depthBuffer:true
  });
  const colorSamples=gl.getInternalformatParameter(gl.RENDERBUFFER,hdr?gl.RGBA16F:gl.RGBA8,gl.SAMPLES)||[];
  const depthSamples=gl.getInternalformatParameter(gl.RENDERBUFFER,gl.DEPTH_COMPONENT24,gl.SAMPLES)||[];
  target.samples=[2,4].find(count=>colorSamples.includes(count)&&depthSamples.includes(count))||0;
  const scene=new Scene();
  const camera=new PerspectiveCamera(61,1,.045,300);
  const screenCamera=new Camera();
  let shaderError=null;
  renderer.debug.onShaderError=(context,program,vertex,fragment)=>{
    const log=[context.getProgramInfoLog(program),context.getShaderInfoLog(vertex),
      context.getShaderInfoLog(fragment)].filter(Boolean).join('\n');
    shaderError=new Error('着色器编译失败\n'+log);
  };
  const shadowMaterial=new RawShaderMaterial({
    glslVersion:GLSL3,vertexShader:`
      in vec3 position;
      uniform mat4 modelViewMatrix,projectionMatrix;
      void main(){gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:'precision highp float; out vec4 color; void main(){color=vec4(0.);}',
    colorWrite:false,blending:NoBlending,toneMapped:false
  });
  const deckSize=1024;
  const light=new PerspectiveCamera(104,1,.45,11.);
  light.layers.set(deckShadowLayer);
  light.position.set(...inspectionLight);
  light.lookAt(...inspectionAim);
  light.updateMatrixWorld();
  const shadowDepth=new DepthTexture(deckSize,deckSize,UnsignedIntType);
  shadowDepth.minFilter=shadowDepth.magFilter=LinearFilter;
  shadowDepth.compareFunction=LessEqualCompare;
  const deckShadow=new WebGLRenderTarget(deckSize,deckSize,{depthTexture:shadowDepth,depthBuffer:true});
  const shader=id=>document.getElementById(id).textContent.trim().replace(/^#version 300 es[^\S\n]*\n/,'');
  const surfaceUniforms={
    uEye:{value:[0,0,0]},uOutputHeight:{value:gameHeight},uTone:{value:0},uTime:{value:0},
    uTrain:{value:0},uLift:{value:0},uStroke:{value:0},uEncode:{value:colorScale},
    uInspectionLight:{value:inspectionLight},uInspectionAxis:{value:unit(sub(inspectionAim,inspectionLight))},
    uDeckShadowTexel:{value:1/deckSize},uDeckShadow:{value:shadowDepth},
    uDeckShadowMatrix:{value:light.projectionMatrix.clone().multiply(light.matrixWorldInverse)},
    uSurfaceFinish:{value:surfaceFinish},uSurfaceSpecular:{value:surfaceSpecular}
  };
  const surface=new RawShaderMaterial({
    glslVersion:GLSL3,vertexShader:shader('mesh-vertex'),fragmentShader:shader('mesh-surface'),
    uniforms:surfaceUniforms,blending:NoBlending,toneMapped:false
  });
  const parts=buildMobileShaft(scene,surface,AbyssThree);
  const geometry=new BufferGeometry();
  geometry.setAttribute('position',new Float32BufferAttribute([-1,-1,0,3,-1,0,-1,3,0],3));
  const post=createPostPipeline(renderer,AbyssThree,geometry,screenCamera,1/colorScale,target.samples===0);
  renderer.setRenderTarget(target);
  const ready=renderer.compileAsync(scene,camera);
  renderer.setRenderTarget(null);
  await Promise.all([ready,post.compile()]);
  // The inspection fixture and its casters are static. Bake their raster depth once.
  scene.overrideMaterial=shadowMaterial;
  renderer.setRenderTarget(deckShadow);
  renderer.render(scene,light);
  renderer.setRenderTarget(null);
  scene.overrideMaterial=null;
  if(shaderError)throw shaderError;
  if(gl.isContextLost())throw new Error('启动时 GPU 渲染上下文中断，请重新加载页面。');

  let width=1,height=1,drawCalls=0,triangles=0;
  function resize(outW,outH,internalScale=1){
    if(canvas.width!==outW||canvas.height!==outH)renderer.setSize(outW,outH,false);
    const w=Math.max(1,Math.round(outW*internalScale)),h=Math.max(1,Math.round(outH*internalScale));
    if(w===width&&h===height)return;
    if(Math.max(w,h)>renderer.capabilities.maxTextureSize)throw new Error('渲染分辨率超出 GPU 限制。');
    width=w;height=h;target.setSize(w,h);
    camera.aspect=w/h;
    camera.fov=w<h?73:61;
    camera.updateProjectionMatrix();
    surfaceUniforms.uOutputHeight.value=h;
  }
  function draw(p,t,tone,effects){
    const cam=basis(p),d=mechanisms(t);
    camera.position.set(...cam.eye);
    camera.lookAt(...add(cam.eye,cam.f));
    parts.animate(t,d);
    const values={uEye:cam.eye,uTime:t,uTone:tone,uTrain:d.train,uLift:d.lift,uStroke:d.stroke};
    for(const name in values)surfaceUniforms[name].value=values[name];
    renderer.setRenderTarget(target);
    renderer.render(scene,camera);
    drawCalls=renderer.info.render.calls;
    triangles=renderer.info.render.triangles;
    post.draw(target.texture,width,height,canvas.width,canvas.height,t,tone,effects);
    if(shaderError)throw shaderError;
  }
  let fence=null,submittedAt=0;
  function discardFence(){
    if(fence)gl.deleteSync(fence);
    fence=null;
  }
  function submit(now){
    fence=gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE,0);
    submittedAt=now;
    if(fence)gl.flush();
  }
  function poll(now){
    if(!fence)return 0;
    const status=gl.clientWaitSync(fence,0,0);
    if(status===gl.TIMEOUT_EXPIRED)return -1;
    discardFence();
    return status===gl.WAIT_FAILED?0:now-submittedAt;
  }
  return {gl,resize,draw,submit,poll,discardFence,revision:REVISION,
    internalSize:()=>[width,height],stats:()=>({drawCalls:drawCalls+post.passes(),postPasses:post.passes(),triangles,samples:target.samples})};
}
async function setup(){
  const exporting=query.has('capture');
  if(exporting)boot.hidden=true;
  else await paint();
  const render=await createRenderer();
  const keys=new Set(),pointers=new Map();
  const state={pose:tourAt(0),paused:prefersStill.matches,
    scene:0,tone:0,targetTone:0,velocity:[0,0,0],
    last:0,raf:0,dirty:true,idleSamples:4,
    targetFps:30,nextDraw:0,adjustAt:0,upgradeAfter:0,fastChecks:0,slowChecks:0,
    gpuMs:17,frameMs:33,frames:0};
  let capture=exporting,activePreset='high';
  const postControls=exporting?null:setupPostControls('abyss.post.mobile.v1',invalidate,()=>{
    keys.clear();pointers.clear();state.velocity=[0,0,0];
  });
  function requestFrame(){
    if(!state.raf&&!capture&&!document.hidden)state.raf=requestAnimationFrame(tick);
  }
  function invalidate(){
    state.dirty=true;
    requestFrame();
  }
  function setPaused(value){
    state.paused=value;
    invalidate();
  }
  function resetView(){
    state.pose=tourAt(0);
    state.velocity=[0,0,0];
    invalidate();
  }
  function hasFlight(){
    return ['KeyW','KeyA','KeyS','KeyD','KeyQ','KeyE'].some(k=>keys.has(k)) ||
      Array.from(pointers.values()).some(p=>p.kind==='fly');
  }
  function update(dt){
    const follow=1-Math.exp(-dt*9);
    state.tone+=(state.targetTone-state.tone)*follow;
    if(!state.paused)state.scene+=dt;
    const cam=basis(state.pose);
    let forward=(keys.has('KeyW')?1:0)-(keys.has('KeyS')?1:0);
    let sideways=(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0);
    const vertical=(keys.has('KeyE')?1:0)-(keys.has('KeyQ')?1:0);
    for(const p of pointers.values()){
      if(p.kind==='fly'){
        sideways+=clamp(p.x/54,-1,1);
        forward-=clamp(p.y/54,-1,1);
      }
    }
    const speed=keys.has('ShiftLeft')||keys.has('ShiftRight')?23:7.2;
    const direction=add(add(scale(cam.r,sideways),scale(cam.f,forward)),[0,vertical,0]);
    const velocity=scale(direction,speed/Math.max(1,Math.hypot(...direction)));
    state.velocity=add(state.velocity,scale(sub(velocity,state.velocity),follow));
    state.pose.eye=add(state.pose.eye,scale(state.velocity,dt));
  }
  function tune(now){
    if(!state.adjustAt){state.adjustAt=now+650;return;}
    if(now<state.adjustAt || (state.paused&&!hasFlight()&&!pointers.size))return;
    state.adjustAt=now+850;
    // Adjust how often frames are submitted while keeping the canvas resolution fixed.
    if(state.targetFps===60){
      const late=state.gpuMs>23.5||state.frameMs>24;
      state.slowChecks=late?state.slowChecks+1:0;
      if(state.slowChecks>=2){
        state.targetFps=30;
        state.upgradeAfter=now+4800;
        state.slowChecks=0;
      }
    }else{
      const room=state.gpuMs<19.2&&state.frameMs<38&&now>=state.upgradeAfter;
      state.fastChecks=room?state.fastChecks+1:0;
      if(state.fastChecks>=3){
        state.targetFps=60;
        state.fastChecks=0;
      }
    }
  }
  function tick(now){
    state.raf=0;
    if(capture||document.hidden)return;
    // Only one frame can be outstanding. Poll the GPU on a later animation frame.
    const gpuMs=render.poll(now);
    if(gpuMs>0 && gpuMs<240)state.gpuMs+=(gpuMs-state.gpuMs)*.15;
    if(gpuMs<0 || now+.8<state.nextDraw){requestFrame();return;}
    const elapsed=state.last?now-state.last:0;
    if(elapsed>0 && elapsed<200)state.frameMs+=(elapsed-state.frameMs)*.16;
    state.last=now;
    tune(now);
    const interval=1000/state.targetFps;
    state.nextDraw=state.nextDraw?Math.max(state.nextDraw+interval,now+interval*.48):now+interval;
    update(Math.min(elapsed/1000,.10));
    try{
      render.resize(gameWidth,gameHeight);
      activePreset=postControls.preset;
      render.draw(state.pose,state.scene,state.tone,postControls.settings);
      render.submit(now);
      state.frames++;
    }catch(e){
      showRenderError(e);
      return;
    }
    boot.hidden=true;
    const changing=!state.paused||hasFlight()||
      Math.hypot(...state.velocity)>.025||Math.abs(state.tone-state.targetTone)>.002;
    if(state.dirty){state.dirty=false;state.idleSamples=4;}
    if(changing||state.idleSamples-- >0)requestFrame();
    else{state.last=0;state.nextDraw=0;}
  }
  const flightKeys=new Set(['KeyW','KeyA','KeyS','KeyD','KeyQ','KeyE','ShiftLeft','ShiftRight']);
  window.addEventListener('keydown',ev=>{
    if(ev.altKey||ev.ctrlKey||ev.metaKey||ev.target.closest?.('#post-panel'))return;
    if(flightKeys.has(ev.code)){
      ev.preventDefault();keys.add(ev.code);
      invalidate();
    }
    if(ev.repeat)return;
    if(ev.code==='KeyP')resetView();
    if(ev.code==='KeyC'){state.targetTone=1-state.targetTone;invalidate();}
    if(ev.code==='KeyF'){ev.preventDefault();if(!capture)setFullscreen(true);}
    if(ev.code==='Space'&&!ev.target.closest?.('#post-toggle')){ev.preventDefault();setPaused(!state.paused);}
  });
  window.addEventListener('keyup',ev=>{if(keys.delete(ev.code))invalidate();});
  window.addEventListener('blur',()=>{keys.clear();pointers.clear();invalidate();});
  canvas.addEventListener('click',()=>{if(!capture)setFullscreen();},{once:true});
  canvas.addEventListener('pointerdown',ev=>{
    if(ev.pointerType==='mouse'&&ev.button!==0)return;
    const {x,y,width,height}=gamePointer(ev);
    const left=ev.pointerType!=='mouse'&&x<width*.48;
    const fly=left&&y>height*.45;
    if(left&&!fly)return;
    pointers.set(ev.pointerId,{kind:fly?'fly':'look',x0:x,y0:y,lastX:x,lastY:y,x:0,y:0});
    canvas.setPointerCapture(ev.pointerId);
    canvas.focus({preventScroll:true});invalidate();
  });
  canvas.addEventListener('pointermove',ev=>{
    const p=pointers.get(ev.pointerId);
    if(p){
      const {x,y}=gamePointer(ev);
      if(p.kind==='fly'){p.x=x-p.x0;p.y=y-p.y0;}
      else{
        state.pose.yaw+=(x-p.lastX)*.0035;
        state.pose.pitch=clamp(state.pose.pitch-(y-p.lastY)*.0035,-1.49,1.49);
      }
      p.lastX=x;p.lastY=y;
      invalidate();
    }
  });
  function endPointer(ev){pointers.delete(ev.pointerId);invalidate();}
  for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,endPointer);
  rotatedView.addEventListener('change',()=>{pointers.clear();invalidate();});
  window.addEventListener('resize',invalidate);
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){
      cancelAnimationFrame(state.raf);
      state.raf=0;state.last=0;state.nextDraw=0;
      keys.clear();pointers.clear();state.velocity=[0,0,0];
      render.discardFence();
    }else{
      invalidate();
    }
  });
  canvas.addEventListener('webglcontextlost',ev=>{
    ev.preventDefault();
    cancelAnimationFrame(state.raf);
    state.raf=0;
    error.hidden=false;
    error.textContent='GPU 渲染已中断，正在等待浏览器恢复。';
  });
  canvas.addEventListener('webglcontextrestored',()=>location.reload());
  prefersStill.addEventListener('change',ev=>{if(ev.matches)setPaused(true);});

  // Explicit frame rendering for the standalone MP4 preview.
  window.abyss=Object.freeze({
    engine:'Three.js r'+render.revision,
    prepareCapture(w,h,internalScale=1){
      capture=true;cancelAnimationFrame(state.raf);state.raf=0;
      document.getElementById('post-ui').hidden=true;
      render.discardFence();
      render.resize(w,h,internalScale);
      return canvas;
    },
    frame(seconds,tone=0,preset='high'){
      if(!capture)throw new Error('Prepare the canvas before rendering a capture frame.');
      const t=clamp(seconds,0,duration);
      activePreset=Object.hasOwn(postPresets,preset)?preset:'high';
      render.draw(withShake(tourAt(t),t),t,tone,presetSettings(preset));
    },
    cameraAt:tourAt,
    status:()=>({position:[...state.pose.eye],yaw:state.pose.yaw,pitch:state.pose.pitch,
      manual:true,paused:state.paused,tour:0,scale:1,
      pipeline:'raster',tone:state.targetTone,postPreset:activePreset,...render.stats(),
      targetFps:state.targetFps,frames:state.frames,gpuWaitMs:state.gpuMs,
      renderSize:render.internalSize(),outputSize:[canvas.width,canvas.height]}),
    renderer:()=>{
      const gl=render.gl,info=gl.getExtension('WEBGL_debug_renderer_info');
      return info?gl.getParameter(info.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);
    }
  });
  invalidate();
  return window.abyss;
}
function showRenderError(e){
  boot.hidden=true;
  error.hidden=false;
  error.textContent=e.message;
  console.error(e);
}
window.abyssReady=setup().catch(e=>{
  showRenderError(e);
  return null;
});
</script>
</body>
